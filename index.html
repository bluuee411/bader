<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hey Baby</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(80, 130, 200, 0.15), transparent 25%),
                radial-gradient(circle at 80% 30%, rgba(100, 150, 220, 0.12), transparent 25%),
                linear-gradient(180deg, #020617 0%, #06142f 50%, #020817 100%);
            color: white;
            position: relative;
        }

        /* Stars */
        .stars {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px white;
            animation: twinkle 2s infinite ease-in-out;
        }

        .star:nth-child(1) { top: 8%; left: 12%; animation-delay: .2s; }
        .star:nth-child(2) { top: 17%; left: 28%; animation-delay: .8s; }
        .star:nth-child(3) { top: 10%; left: 70%; animation-delay: 1.2s; }
        .star:nth-child(4) { top: 25%; left: 88%; animation-delay: .4s; }
        .star:nth-child(5) { top: 35%; left: 8%; animation-delay: 1.5s; }
        .star:nth-child(6) { top: 42%; left: 22%; animation-delay: .5s; }
        .star:nth-child(7) { top: 31%; left: 48%; animation-delay: 1s; }
        .star:nth-child(8) { top: 50%; left: 78%; animation-delay: .3s; }
        .star:nth-child(9) { top: 65%; left: 13%; animation-delay: 1.7s; }
        .star:nth-child(10) { top: 72%; left: 35%; animation-delay: .7s; }
        .star:nth-child(11) { top: 60%; left: 58%; animation-delay: 1.1s; }
        .star:nth-child(12) { top: 78%; left: 85%; animation-delay: .1s; }
        .star:nth-child(13) { top: 88%; left: 20%; animation-delay: 1.4s; }
        .star:nth-child(14) { top: 15%; left: 52%; animation-delay: .6s; }
        .star:nth-child(15) { top: 82%; left: 68%; animation-delay: 1.8s; }
        .star:nth-child(16) { top: 55%; left: 92%; animation-delay: .9s; }
        .star:nth-child(17) { top: 92%; left: 48%; animation-delay: .4s; }
        .star:nth-child(18) { top: 5%; left: 90%; animation-delay: 1.3s; }
        .star:nth-child(19) { top: 46%; left: 40%; animation-delay: .2s; }
        .star:nth-child(20) { top: 68%; left: 5%; animation-delay: 1.6s; }

        @keyframes twinkle {
            0%, 100% {
                opacity: .25;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        .moon {
            position: absolute;
            top: 8%;
            right: 10%;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #f7f9ff;
            box-shadow: 0 0 35px rgba(255,255,255,.35);
        }

        .moon::after {
            content: "";
            position: absolute;
            top: -5px;
            left: 18px;
            width: 75px;
            height: 75px;
            background: #03091b;
            border-radius: 50%;
        }

        .content {
            position: relative;
            z-index: 5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .title {
            font-size: clamp(42px, 8vw, 75px);
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 45px;
            text-shadow: 0 0 18px rgba(255,255,255,.25);
        }

        /* Envelope */
        .mail {
            width: 230px;
            height: 155px;
            position: relative;
            cursor: pointer;
            transition: transform .35s ease;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,.35));
        }

        .mail:hover {
            transform: translateY(-10px) scale(1.04);
        }

        .envelope {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #f7f7f5;
            border-radius: 6px;
            overflow: hidden;
        }

        .envelope::before {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-left: 115px solid transparent;
            border-right: 115px solid transparent;
            border-bottom: 85px solid #e7e7e5;
            z-index: 3;
        }

        .envelope::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 0;
            height: 0;
            border-left: 115px solid transparent;
            border-right: 115px solid transparent;
            border-top: 88px solid #ffffff;
            z-index: 4;
            transform-origin: top;
        }

        .letter-paper {
            position: absolute;
            width: 170px;
            height: 110px;
            background: white;
            left: 30px;
            top: 20px;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
        }

        .mail-heart {
            position: absolute;
            z-index: 5;
            left: 50%;
            top: 57%;
            transform: translate(-50%, -50%);
            color: #6c8fba;
            font-size: 26px;
        }

        .email-text {
            margin-top: 28px;
            font-size: 17px;
            letter-spacing: 1px;
            font-weight: 400;
            opacity: .85;
        }
    </style>
</head>

<body>

    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>

    <div class="moon"></div>

    <div class="content">

        <div class="title">
            hey baby
        </div>

        <div class="mail" onclick="openMail()">
            <div class="letter-paper"></div>

            <div class="envelope"></div>

            <div class="mail-heart">
                ♥
            </div>
        </div>

        <div class="email-text">
            you've got new emails
        </div>

    </div>

    <script>
        function openMail() {
            window.location.href = "email.html";
        }
    </script>

</body>
</html>
